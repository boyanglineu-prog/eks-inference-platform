# .github/workflows/deploy.yml
name: Build and Deploy

on:
  push:
    branches: [main] # trigger on every push to main

jobs:
  deploy:
    runs-on: ubuntu-latest # GitHub's Linux runner

    steps:
      # 1. checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # 3. login to ECR
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4. build and push image
      - name: Build and push Docker image
        run: |
          docker build --platform linux/amd64 \
            -t 454518197798.dkr.ecr.us-west-2.amazonaws.com/inference-platform:latest \
            -f docker/Dockerfile .
          docker push 454518197798.dkr.ecr.us-west-2.amazonaws.com/inference-platform:latest

      # 5. update kubeconfig
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name inference-platform \
            --region us-west-2

      # 6. deploy to EKS via Helm
      - name: Deploy to EKS
        run: |
          helm upgrade inference-platform ./helm/inference-platform
