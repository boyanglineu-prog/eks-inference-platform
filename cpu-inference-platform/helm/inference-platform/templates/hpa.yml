# templates/hpa.yml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-platform
  minReplicas: {{ .Values.autoscaling.minReplicas}} # from values.yaml
  maxReplicas: {{ .Values.autoscaling.maxReplicas}} # from values.yaml
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilization}} # from values.yaml
