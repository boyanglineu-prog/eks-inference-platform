# This rule is not used by the project scaler-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to autoscaling.example.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: scaler-controller
    app.kubernetes.io/managed-by: kustomize
  name: scalingpolicy-viewer-role
rules:
- apiGroups:
  - autoscaling.example.com
  resources:
  - scalingpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling.example.com
  resources:
  - scalingpolicies/status
  verbs:
  - get
