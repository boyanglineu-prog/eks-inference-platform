# This rule is not used by the project scaler-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over autoscaling.example.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: scaler-controller
    app.kubernetes.io/managed-by: kustomize
  name: scalingpolicy-admin-role
rules:
- apiGroups:
  - autoscaling.example.com
  resources:
  - scalingpolicies
  verbs:
  - '*'
- apiGroups:
  - autoscaling.example.com
  resources:
  - scalingpolicies/status
  verbs:
  - get
